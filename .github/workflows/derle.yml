name: APK derle

on:
  push:
    branches: [main]
    paths-ignore:
      - "sorular/**"
      - "**.md"
      - "firestore.rules"
      - "docs/**"
      - "araclar/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Güncel soruları uygulamaya ekle
        run: |
          mkdir -p app/src/main/assets
          cp sorular/sorular.json app/src/main/assets/sorular.json

      - name: APK'yı derle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/release/app-release.apk Lisansla.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lisansla-apk
          path: Lisansla.apk

      - name: İndirme sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Lisansla 0.1.${{ github.run_number }}
          body: |
            Telefona kurmak için aşağıdaki **Lisansla.apk** dosyasını indir.
            Bu bir test sürümüdür.
          files: Lisansla.apk
          make_latest: true
