name: APK derle

on:
  push:
    branches: [main]
    paths-ignore:
      - "sorular/**"
      - "**.md"
      - "firestore.rules"
      - "docs/**"
      - "araclar/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Güncel soruları ve metinleri uygulamaya ekle
        run: |
          mkdir -p app/src/main/assets
          cp sorular/sorular.json app/src/main/assets/sorular.json
          mkdir -p app/src/main/res/raw
          cp metinler/aydinlatma.txt app/src/main/res/raw/aydinlatma.txt

      - name: APK'yı derle
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee derleme.log

      - name: Derleme hatalarını özetle
        if: failure()
        run: |
          grep -E "^e: |What went wrong|^> |error:|Exception" -A3 derleme.log | head -80 > hatalar.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' hatalar.txt)
          echo "::error title=Derleme hatalari::$msg"

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/release/app-release.apk Lisansla.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lisansla-apk
          path: Lisansla.apk

      - name: İndirme sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Lisansla 0.1.${{ github.run_number }}
          body: |
            Telefona kurmak için aşağıdaki **Lisansla.apk** dosyasını indir.
            Bu bir test sürümüdür.
          files: Lisansla.apk
          make_latest: true
